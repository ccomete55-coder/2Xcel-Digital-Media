# Nginx reverse proxy for Hermes — place in /etc/nginx/sites-available/hermes
# then: ln -s into sites-enabled, test with `nginx -t`, reload.
# TLS certs are added automatically by certbot (see README).

server {
    server_name hermes.2xcel.net;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
}
