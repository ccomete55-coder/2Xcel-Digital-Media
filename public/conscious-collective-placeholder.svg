<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Premium Warm-Minimalist Canvas Background -->
  <rect width="800" height="600" fill="#FCFBF9" />
  
  <!-- Subtle Soft Gradient Overlay for depth -->
  <radialGradient id="grad" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#F3EFE9" stop-opacity="1"/>
  </radialGradient>
  <rect width="800" height="600" fill="url(#grad)" />
  
  <!-- Elegant Fine Border -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#E6DFD5" stroke-width="2" rx="4" />
  <rect x="28" y="28" width="744" height="544" fill="none" stroke="#E6DFD5" stroke-width="0.5" rx="2" />
  
  <!-- Decorative Top Brand Ornament (Luxury Seal representation) -->
  <line x1="360" y1="60" x2="440" y2="60" stroke="#C5A059" stroke-width="1" />
  <circle cx="400" cy="60" r="3" fill="#0F3D26" />
  
  <!-- Central Branded 'Cc' Monogram -->
  <g transform="translate(0, -10)">
    <!-- Main Capital 'C' in Forest Green -->
    <!-- Large classic elegant serif presentation -->
    <text x="400" y="320" 
          font-family="Georgia, Didot, Cambria, 'Times New Roman', serif" 
          font-size="280" 
          font-weight="normal"
          fill="#0F3D26" 
          text-anchor="middle" 
          dominant-baseline="middle"
          letter-spacing="-10">C</text>
          
    <!-- Inner Junior 'c' in Lustrous Gold -->
    <!-- Positioned precisely nestled within the C's aperture -->
    <text x="495" y="315" 
          font-family="Georgia, Didot, Cambria, 'Times New Roman', serif" 
          font-size="140" 
          font-weight="normal"
          fill="#C5A059" 
          text-anchor="middle" 
          dominant-baseline="middle">c</text>
  </g>
  
  <!-- Subtitle / Brand Typography at Bottom -->
  <text x="400" y="480" 
        font-family="'Space Grotesk', Inter, system-ui, sans-serif" 
        font-size="14" 
        font-weight="600"
        fill="#0F3D26" 
        letter-spacing="8" 
        text-anchor="middle">THE CONSCIOUS COLLECTIVE</text>
        
  <text x="400" y="505" 
        font-family="Georgia, serif" 
        font-size="12" 
        font-style="italic"
        fill="#C5A059" 
        letter-spacing="2" 
        text-anchor="middle">Strategic HR Consulting &amp; Workplace Culture Advisory</text>
</svg>
